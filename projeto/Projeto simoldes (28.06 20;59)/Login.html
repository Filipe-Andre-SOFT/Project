<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Simoldes Connect - Login</title>
  <link rel="stylesheet" href="Estilo.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="simoldes_connect_logo_transparente_menor-removebg-preview.png" alt="Logo Simoldes" class="logo" />
    </div>
    <div class="main">
      <div class="login-box">
        <h2><i>LOGIN</i></h2>
        
        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario" autocomplete="username" />
        
        <label for="senha">Senha:</label>
        <input type="password" id="senha" autocomplete="current-password" />
        
        <button type="button" id="btn-login">Entrar</button>
      </div>
    </div>
  </div>
  <script src="Program.js"></script>
</body>
</html>
